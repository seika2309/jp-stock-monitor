{% extends "base.html" %}{% block content %}<h1>全部商品</h1>
<table><tr><th></th><th>网站</th><th>商品</th><th>价格</th><th>规格数</th><th>缺货规格</th><th>最后检查</th></tr>
{% for p in rows %}<tr><td>{% if p.image_url %}<img class="thumb" src="{{p.image_url}}">{% endif %}</td><td>{{p.site}}</td><td><a href="/product/{{p.id}}">{{p.name}}</a></td><td>{{p.price}}</td><td>{{p.variants}}</td><td>{{p.out_count or 0}}</td><td>{{p.last_checked}}</td></tr>{% else %}<tr><td colspan="7">尚无数据，请回总览点击“立即检查”。</td></tr>{% endfor %}</table>{% endblock %}
