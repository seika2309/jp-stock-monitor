name: Stock Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 运行库存监控
        run: |
          python - <<'PYTHON'
          import asyncio

          from app.db import init_db
          from app.service import run_monitor
          from app.monitors.lifes import LifesMonitor
          from app.monitors.etre import EtreMonitor

          async def main():
              init_db()

              print("开始检查 LIFE's #203...")
              lifes_count = await run_monitor(LifesMonitor())
              print(f"LIFE's #203：发现 {lifes_count} 个商品")

              print("开始检查 ETRÉ TOKYO...")
              etre_count = await run_monitor(EtreMonitor())
              print(f"ETRÉ TOKYO：发现 {etre_count} 个商品")

              print("两个网站检查完成")

          asyncio.run(main())
          PYTHON
          
      - name: 生成库存报告
        run: |
          python -m app.report

      - name: 保存库存数据库
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/monitor.db
          git add stock_report.md
          git commit -m "update stock database and report" || exit 0
          git push
